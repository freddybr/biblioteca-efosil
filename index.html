<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Biblioteca Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased" x-data="bibliotecaApp()">

  <div x-show="!sesionIniciada" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-700 to-indigo-900">
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl max-w-sm w-full space-y-6">
      <div class="text-center">
        <span class="text-4xl">📚</span>
        <h2 class="text-2xl font-bold text-gray-900 mt-2">Mi Biblioteca</h2>
        <p class="text-sm text-gray-500 mt-1">Ingresa tu correo autorizado para acceder</p>
      </div>
      
      <form @submit.prevent="loginUsuario()">
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Correo Electrónico</label>
            <input 
              type="email" 
              required
              x-model="loginEmail" 
              placeholder="ejemplo@correo.com" 
              class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition"
            >
          </div>
          
          <button 
            type="submit" 
            :disabled="conectando"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-md flex items-center justify-center gap-2"
          >
            <template x-if="conectando">
              <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </template>
            <span x-text="conectando ? 'Validando...' : 'Iniciar Sesión'"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div x-show="sesionIniciada" class="min-h-screen flex flex-col" x-cloak>
    
    <header class="bg-blue-600 text-white sticky top-0 z-40 shadow-md">
      <div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center gap-4">
        <div>
          <h1 class="text-lg sm:text-2xl font-black tracking-tight flex items-center gap-2">Mi Biblioteca</h1>
          <p class="text-[10px] sm:text-xs text-blue-200 font-medium tracking-wide flex items-center gap-1">
            <span>👤 Usuario:</span>
            <span class="sm:hidden" x-text="usuario.email.split('@')[0]"></span> <span class="hidden sm:inline" x-text="usuario.email"></span>       </p>
        </div>
        <div class="flex items-center gap-2 sm:gap-3">
          <template x-if="usuario.permissions.crear">
            <button @click="modalAñadir = true" class="bg-green-500 hover:bg-green-600 text-white font-bold px-3 py-2 rounded-xl text-xs sm:text-sm shadow-md hover:shadow-lg flex items-center gap-1 transition">
              <span>+ Añadir</span>
            </button>
          </template>
          <button @click="cerrarSesion()" class="text-xs font-semibold bg-blue-700 hover:bg-blue-800 px-3 py-2 rounded-xl border border-blue-500/30 transition">Salir</button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
        <div class="w-full md:w-1/3 relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">🔍</span>
          <input 
            type="text" 
            x-model="busqueda" 
            placeholder="Buscar por ID, título, descripción o tags..." 
            class="w-full pl-9 pr-4 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700 transition"
          />
        </div>

        <div class="w-full md:w-auto flex flex-col sm:flex-row gap-3 items-center w-full md:justify-end">
          <div class="w-full sm:w-44">
            <select x-model="filtroArea" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm text-gray-600 focus:ring-2 focus:ring-blue-500 outline-none transition">
              <option value="">Todas las Áreas</option>
              <template x-for="area in areas" :key="area">
                <option :value="area" x-text="area"></option>
              </template>
            </select>
          </div>

          <div class="w-full sm:w-44">
            <select x-model="filtroCategoria" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm text-gray-600 focus:ring-2 focus:ring-blue-500 outline-none transition">
              <option value="">Todas las Categorías</option>
              <template x-for="cat in categorias" :key="cat">
                <option :value="cat" x-text="cat"></option>
              </template>
            </select>
          </div>

          <template x-if="busqueda || filtroArea || filtroCategoria">
            <button 
              @click="busqueda = ''; filtroArea = ''; filtroCategoria = ''" 
              class="w-full sm:w-auto px-4 py-2 text-xs font-bold bg-gray-100 hover:bg-gray-200 text-gray-500 rounded-xl transition"
            >
              Limpiar
            </button>
          </template>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden relative min-h-[250px]">
        
        <div x-show="cargando" class="absolute inset-0 bg-white/70 backdrop-blur-[1px] flex flex-col items-center justify-center z-10 transition-all">
          <div class="animate-spin rounded-full h-10 w-10 border-4 border-gray-200 border-t-blue-600 mb-3"></div>
          <p class="text-xs font-semibold text-gray-500 tracking-wide animate-pulse">Sincronizando biblioteca técnica...</p>
        </div>

        <div class="overflow-x-auto" :class="{ 'opacity-30 pointer-events-none': cargando }">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gray-50 border-b border-gray-100 text-xs font-bold text-gray-500 uppercase tracking-wider">
                <th class="p-4">ID</th>
                <th class="p-4">Título</th>
                <th class="p-4 hidden md:table-cell">Categoría</th>
                <th class="p-4 hidden sm:table-cell">Área</th>
                <th class="p-4 hidden lg:table-cell">Fecha</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 text-sm">
              <template x-for="item in archivosFiltrados" :key="item.id">
                <tr @click="abrirDetalles(item)" class="hover:bg-blue-50/50 cursor-pointer transition">
                  <td class="p-4 font-mono font-bold text-blue-600" x-text="item.id"></td>
                  <td class="p-4">
                    <div class="font-semibold text-gray-800" x-text="item.titulo"></div>
                    <div class="md:hidden text-xs text-gray-400 mt-0.5 flex gap-2">
                      <span x-text="item.categoria"></span> • <span x-text="item.area"></span>
                    </div>
                  </td>
                  <td class="p-4 hidden md:table-cell text-gray-600" x-text="item.categoria"></td>
                  <td class="p-4 hidden sm:table-cell text-gray-600">
                    <span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-green-50 text-green-700" x-text="item.area"></span>
                  </td>
                  <td class="p-4 hidden lg:table-cell text-gray-400" x-text="new Date(item.fecha).toLocaleDateString()"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <template x-if="!cargando && archivosFiltrados.length === 0">
          <div class="text-center py-12 text-gray-400 text-sm">No se encontraron registros que coincidan con los filtros.</div>
        </template>
      </div>
    </main>

    <div x-show="modalDetalles" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" x-cloak>
      <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-gray-100 max-h-[90vh] overflow-y-auto" @click.away="if(!editando) modalDetalles = false">
        
        <div class="flex justify-between items-start mb-4">
          <div>
            <span class="font-mono text-xs font-black bg-blue-50 text-blue-600 px-2.5 py-1 rounded-md" x-text="itemDetalle.id"></span>
            <template x-if="!editando">
              <h3 class="text-xl font-bold text-gray-900 mt-2" x-text="itemDetalle.titulo"></h3>
            </template>
            <template x-if="editando">
              <div class="mt-2 w-full">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Título del Documento *</label>
                <input type="text" x-model="formEdicion.titulo" class="w-full p-2 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              </div>
            </template>
          </div>
          <button @click="modalDetalles = false; cancelarEdicion()" class="text-gray-400 hover:text-gray-600 text-xl font-bold p-1">&times;</button>
        </div>

        <div class="space-y-4 my-4 border-t border-b border-gray-100 py-4 text-sm text-gray-700">
          
          <div>
            <span class="font-bold text-gray-500 block text-xs uppercase mb-1">Descripción:</span>
            <template x-if="!editando">
              <p class="text-gray-800 bg-gray-50/50 p-2 rounded-xl" x-text="itemDetalle.descripcion || 'Sin descripción disponible.'"></p>
            </template>
            <template x-if="editando">
              <textarea x-model="formEdicion.descripcion" rows="3" class="w-full p-2 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </template>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <span class="font-bold text-gray-500 block text-xs uppercase mb-1">Categoría:</span>
              <template x-if="!editando">
                <span class="text-gray-800 font-medium bg-gray-50 p-2 rounded-xl block" x-text="itemDetalle.categoria"></span>
              </template>
              <template x-if="editando">
                <select x-model="formEdicion.categoria" class="w-full p-2 border border-gray-300 rounded-xl bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                  <template x-for="cat in categorias" :key="cat">
                    <option :value="cat" x-text="cat" :selected="cat === formEdicion.categoria"></option>
                  </template>
                </select>
              </template>
            </div>

            <div>
              <span class="font-bold text-gray-500 block text-xs uppercase mb-1">Área Técnica:</span>
              <template x-if="!editando">
                <span class="text-gray-800 font-medium bg-gray-50 p-2 rounded-xl block" x-text="itemDetalle.area"></span>
              </template>
              <template x-if="editando">
                <select x-model="formEdicion.area" class="w-full p-2 border border-gray-300 rounded-xl bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                  <template x-for="area in areas" :key="area">
                    <option :value="area" x-text="area" :selected="area === formEdicion.area"></option>
                  </template>
                </select>
              </template>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <span class="font-bold text-gray-500 block text-xs uppercase mb-1">Registrado por:</span>
              <span class="text-gray-600 bg-gray-50 p-2 rounded-xl block" x-text="itemDetalle.usuario"></span>
            </div>
            <div>
              <span class="font-bold text-gray-500 block text-xs uppercase mb-1">Tags:</span>
              <template x-if="!editando">
                <span class="text-gray-600 bg-gray-50 p-2 rounded-xl block" x-text="itemDetalle.tags || 'Ninguno'"></span>
              </template>
              <template x-if="editando">
                <input type="text" x-model="formEdicion.tags" placeholder="Separados por coma" class="w-full p-2 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              </template>
            </div>
          </div>
        </div>

        <div class="flex flex-wrap justify-end gap-2 mt-6">
          
          <template x-if="!editando">
            <div class="flex gap-2 w-full sm:w-auto justify-end">
              <button @click="modalDetalles = false" class="px-4 py-2 text-sm font-semibold bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition">Cerrar</button>
              
              <a :href="itemDetalle.url" target="_blank" class="px-4 py-2 text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-sm transition flex items-center gap-1">
                <span>Abrir Archivo 🚀</span>
              </a>

              <template x-if="usuario.permissions.editar">
                <button @click="activarEdicion()" class="px-4 py-2 text-sm font-bold bg-amber-500 hover:bg-amber-600 text-white rounded-xl shadow-sm transition">Editar</button>
              </template>
              
              <template x-if="usuario.permissions.borrar">
                <button @click="ejecutarEliminacion()" class="px-4 py-2 text-sm font-bold bg-red-600 hover:bg-red-700 text-white rounded-xl shadow-sm transition">Eliminar</button>
              </template>
            </div>
          </template>

          <template x-if="editando">
            <div class="flex gap-2 w-full sm:w-auto justify-end">
              <button type="button" @click="cancelarEdicion()" :disabled="guardandoCambios" class="px-4 py-2 text-sm font-semibold bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition">
                Cancelar
              </button>
              <button type="button" @click="guardarCambiosEdicion()" :disabled="guardandoCambios" class="px-4 py-2 text-sm font-bold bg-green-600 hover:bg-green-700 text-white rounded-xl shadow-sm transition flex items-center gap-2">
                <template x-if="guardandoCambios">
                  <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </template>
                <span x-text="guardandoCambios ? 'Guardando...' : 'Confirmar Cambios 💾'"></span>
              </button>
            </div>
          </template>

        </div>
      </div>
    </div>

    <div x-show="modalAñadir" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" x-cloak>
      <div class="bg-white rounded-xl max-w-md w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="text-base font-bold text-gray-900">Registrar Nuevo Archivo</h3>
          <button @click="modalAñadir = false" class="text-gray-400 hover:text-gray-600 text-lg">&times;</button>
        </div>

        <form @submit.prevent="subirNuevoArchivo()" class="space-y-3 text-xs">
          <div>
            <label class="block font-medium text-gray-600 mb-0.5">Título del Documento *</label>
            <input type="text" required x-model="nuevoForm.titulo" class="w-full p-2 border rounded-md">
          </div>
          <div>
            <label class="block font-medium text-gray-600 mb-0.5">Descripción</label>
            <textarea x-model="nuevoForm.descripcion" rows="2" class="w-full p-2 border rounded-md"></textarea>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-medium text-gray-600 mb-0.5">Área *</label>
              <select required x-model="nuevoForm.area" class="w-full p-2 border rounded-md bg-white">
                <option value="">Selecciona...</option>
                <template x-for="area in areas" :key="area">
                  <option :value="area" x-text="area"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block font-medium text-gray-600 mb-0.5">Categoría *</label>
              <select required x-model="nuevoForm.categoria" class="w-full p-2 border rounded-md bg-white">
                <option value="">Selecciona...</option>
                <template x-for="cat in categorias" :key="cat">
                  <option :value="cat" x-text="cat"></option>
                </template>
              </select>
            </div>
          </div>
          <div>
            <label class="block font-medium text-gray-600 mb-0.5">Tags (Separados por coma)</label>
            <input type="text" x-model="nuevoForm.tags" placeholder="Finanzas, Manual" class="w-full p-2 border rounded-md">
          </div>
          <div class="mb-4">
  <label class="block text-sm font-bold text-gray-700 mb-1">Seleccionar Archivo</label>
  <input 
    type="file" 
    @change="procesarArchivoAdjunto($event)" 
    class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition"
    required
  />
</div>

<div class="mb-4">
  <label class="block text-sm font-bold text-gray-700 mb-1">Título del Documento</label>
  <input 
    type="text" 
    x-model="nuevoForm.titulo" 
    placeholder="Ej. Manual de Procedimientos de Perforación" 
    class="w-full px-3 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
    required
  />
</div>

          <div class="flex justify-end gap-2 pt-2 border-t">
            <button type="button" @click="modalAñadir = false" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-md">Cancelar</button>
            <button type="submit" :disabled="subiendo" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-md flex items-center gap-1">
              <template x-if="subiendo"><svg class="animate-spin h-3 w-3 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></template>
              <span x-text="subiendo ? 'Subiendo...' : 'Guardar'"></span>
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script>
    // URL DE LA WEB APP PUBLICADA EN GOOGLE APPS SCRIPT
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymLhJSC2CvNTMtYM5iR5haQR_K5mZZ0Amp5vGVACrf5a3bpKlu9fl8ntl7SAe9Osqn/exec";

    // FUNCIÓN GLOBAL AUXILIAR: Resuelve las consultas (GET) usando JSONP puro y seguro
    function ejecutarPeticionJSONP(action, params = {}) {
      return new Promise((resolve, reject) => {
        // Generar un nombre único para el callback global
        const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
        
        // Definir la función en el objeto window para que Google la invoque
        window[callbackName] = function(data) {
          delete window[callbackName];
          const script = document.getElementById(callbackName);
          if (script) document.body.removeChild(script);
          resolve(data);
        };
        
        // Construir URL con la acción y el callback requerido
        let url = WEB_APP_URL + '?action=' + action + '&callback=' + callbackName;
        for (let key in params) {
          url += '&' + key + '=' + encodeURIComponent(params[key]);
        }
        
        // Inyectar el tag script de manera dinámica
        const script = document.createElement('script');
        script.id = callbackName;
        script.src = url;
        script.onerror = () => {
          delete window[callbackName];
          document.body.removeChild(script);
          reject(new Error('Fallo en la comunicación del servidor (JSONP)'));
        };
        document.body.appendChild(script);
      });
    }

    function bibliotecaApp() {
      return {
        sesionIniciada: false,
        conectando: false,
        cargando: false,
        subiendo: false,
        modalAñadir: false,
        
        loginEmail: '',
        busqueda: '',
        filtroArea: '',
        filtroCategoria: '',
        
        usuario: { email: '', rol: '', permissions: { crear: false, leer: false } },
        archivos: [],
        areas: [],
        categorias: [],
        
        nuevoForm: { titulo: '', descripcion: '', area: '', categoria: '', tags: '', file: null },

        // ... Variables anteriores (sesionIniciada, archivos, etc.) ...
        modalAñadir: false,
        modalDetalles: false, // NUEVO: Estado del modal informativo
        itemDetalle: {},      // NUEVO: Almacena el objeto de archivo seleccionado
        editando: false,
        guardandoCambios: false,
        formEdicion: { id: '', titulo: '', descripcion: '', area: '', categoria: '', tags: '' },

        // ... Filtros y colecciones ...
        usuario: { email: '', rol: '', permissions: { crear: false, leer: false, editar: false, borrar: false } },

        async loginUsuario() {
          if (!this.loginEmail) return alert('Por favor, ingresa tu correo electrónico');
          this.conectando = true;
          
          try {
            // Llamada segura usando la función global externa
            const data = await ejecutarPeticionJSONP('validarUsuario', { email: this.loginEmail });
            
            if (data.status === 'success') {
              this.usuario.email = this.loginEmail.trim().toLowerCase();
              this.usuario.rol = data.rol;
              this.usuario.permissions = data.permissions;
              this.sesionIniciada = true;
              
              await this.inicializarDatos();
            } else {
              alert(data.message);
            }
          } catch (e) {
            alert('Error de autenticación: Verifica tu conexión o que el script esté publicado correctamente.');
            console.error(e);
          } finally {
            this.conectando = false;
          }
        },

        async inicializarDatos() {
          this.cargando = true;
          try {
            // 1. Obtener listados dinámicos para los filtros desplegables
            const dataFiltros = await ejecutarPeticionJSONP('obtenerFiltrosDinamicos', { email: this.usuario.email });
            if (dataFiltros && dataFiltros.status === 'success') {
              this.areas = dataFiltros.areas;
              this.categorias = dataFiltros.categorias;
            }

            // 2. Obtener catálogo completo de archivos
            const dataArchivos = await ejecutarPeticionJSONP('obtenerArchivos', { email: this.usuario.email });
            if (dataArchivos && dataArchivos.status === 'success') {
              this.archivos = dataArchivos.data;
            }
          } catch (error) {
            console.error('Error al sincronizar el catálogo:', error);
          } finally {
            this.cargando = false;
          }
        },

        get archivosFiltrados() {
          return this.archivos.filter(item => {
            const matchTxt = !this.busqueda || 
              item.id.toLowerCase().includes(this.busqueda.toLowerCase()) ||
              item.titulo.toLowerCase().includes(this.busqueda.toLowerCase()) ||
              (item.descripcion && item.descripcion.toLowerCase().includes(this.busqueda.toLowerCase())) ||
              (item.tags && item.tags.toLowerCase().includes(this.busqueda.toLowerCase()));

            const matchArea = !this.filtroArea || item.area === this.filtroArea;
            const matchCat = !this.filtroCategoria || item.categoria === this.filtroCategoria;

            return matchTxt && matchArea && matchCat;
          });
        },

        abrirDetalles(item) {
          this.itemDetalle = item;
          this.modalDetalles = true;
        },

        activarEdicion() {
            // Setea el formulario de edición con los datos actuales del registro
            this.formEdicion = {
              id: this.itemDetalle.id,
              titulo: this.itemDetalle.titulo,
              descripcion: this.itemDetalle.descripcion,
              area: this.itemDetalle.area,
              categoria: this.itemDetalle.categoria,
              tags: this.itemDetalle.tags
            };
            this.editando = true;
          },

          cancelarEdicion() {
            this.editando = false;
            this.formEdicion = { id: '', titulo: '', descripcion: '', area: '', categoria: '', tags: '' };
          },

          async guardarCambiosEdicion() {
            if (!this.formEdicion.titulo) return alert('El título es obligatorio.');
            this.guardandoCambios = true;

            try {
              const respuesta = await ejecutarPeticionJSONP('editarArchivo', {
                email: this.usuario.email,
                id: this.formEdicion.id,
                titulo: this.formEdicion.titulo,
                descripcion: this.formEdicion.descripcion,
                area: this.formEdicion.area,
                categoria: this.formEdicion.categoria,
                tags: this.formEdicion.tags
              });

              if (respuesta.status === 'success') {
                alert(respuesta.message);
                this.modalDetalles = false;
                this.cancelarEdicion();
                await this.inicializarDatos(); // Recarga la tabla con el spinner
              } else {
                alert(respuesta.message);
              }
            } catch (e) {
              alert('Error al intentar guardar los cambios desde el servidor.');
              console.error(e);
            } finally {
              this.guardandoCambios = false;
            }
          },

          async ejecutarEliminacion() {
            const confirmar = confirm(`¿Estás completamente seguro de que deseas eliminar permanentemente el registro ${this.itemDetalle.id} y su archivo adjunto en Drive?`);
            if (!confirmar) return;

            try {
              const respuesta = await ejecutarPeticionJSONP('eliminarArchivo', {
                email: this.usuario.email,
                id: this.itemDetalle.id
              });

              if (respuesta.status === 'success') {
                alert(respuesta.message);
                this.modalDetalles = false;
                await this.inicializarDatos(); // Limpia la fila de la interfaz de inmediato
              } else {
                alert(respuesta.message);
              }
            } catch (e) {
              alert('Error en el sistema al intentar eliminar.');
              console.error(e);
            }
          },

        procesarArchivoAdjunto(event) {
          const file = event.target.files[0];
          if (!file) return;

          // 1. Extraer el nombre del archivo sin la extensión (.pdf, .xlsx, etc.)
          const nombreOriginal = file.name;
          const indiceExtension = nombreOriginal.lastIndexOf('.');
          const nombreLimpio = indiceExtension !== -1 ? nombreOriginal.substring(0, indiceExtension) : nombreOriginal;

          // 2. Cargar por defecto el nombre en el título permitiendo su edición posterior
          this.nuevoForm.titulo = nombreLimpio;

          // 3. Procesar y convertir a Base64 para el envío seguro a Google Drive
          const reader = new FileReader();
          reader.onload = (e) => {
            this.nuevoForm.file = {
              type: file.type,
              base64: e.target.result
            };
          };
          reader.readAsDataURL(file);
        },

        async subirNuevoArchivo() {
          if (!this.nuevoForm.file) return alert('Selecciona un archivo válido');
          this.subiendo = true;
          
          const payload = {
            action: 'subirArchivo',
            email: this.usuario.email,
            titulo: this.nuevoForm.titulo,
            descripcion: this.nuevoForm.descripcion,
            area: this.nuevoForm.area,
            categoria: this.nuevoForm.categoria,
            tags: this.nuevoForm.tags,
            file: this.nuevoForm.file
          };

          try {
            // El envío POST usa no-cors de manera segura para evitar bloqueos en subidas masivas
            await fetch(WEB_APP_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            
            alert('Documento enviado con éxito. Sincronizando biblioteca...');
            this.modalAñadir = false;
            this.nuevoForm = { titulo: '', descripcion: '', area: '', categoria: '', tags: '', file: null };
            
            const self = this;
            setTimeout(async () => { await self.inicializarDatos(); }, 2500);
          } catch (e) {
            alert('Error al intentar registrar el archivo: ' + e.toString());
          } finally {
            this.subiendo = false;
          }
        },

        cerrarSesion() {
          this.sesionIniciada = false;
          this.usuario = { email: '', rol: '', permissions: { crear: false, leer: false } };
          this.archivos = [];
          this.loginEmail = '';
        }
      }
    }
  </script>
