<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Biblioteca Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased" x-data="bibliotecaApp()">

  <div x-show="!sesionIniciada" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-700 to-indigo-900" x-cloak>
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl max-w-sm w-full space-y-6">
      <div class="text-center">
        <span class="text-4xl">🔒</span>
        <h2 class="text-2xl font-bold text-gray-900 mt-2">Biblioteca Técnica</h2>
        <p class="text-sm text-gray-500 mt-1">Introduce tus credenciales autorizadas</p>
      </div>
      
      <form @submit.prevent="loginUsuario()" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Correo Electrónico</label>
          <input 
            type="email" 
            x-model="emailInput" 
            required 
            placeholder="usuario@empresa.com" 
            class="w-full p-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700 transition" 
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Contraseña</label>
          <div class="relative">
            <input 
              :type="mostrarPassword ? 'text' : 'password'" 
              x-model="password" 
              required 
              placeholder="••••••••" 
              class="w-full p-3 pr-16 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700 transition" 
            />
            <button 
              type="button" 
              @click="mostrarPassword = !mostrarPassword" 
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-xs font-semibold text-blue-600 hover:text-blue-800 focus:outline-none"
              x-text="mostrarPassword ? 'Ocultar' : 'Mostrar'"
            ></button>
          </div>
        </div>
        
        <button 
          type="submit" 
          :disabled="cargando" 
          class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 disabled:opacity-50 text-sm mt-2"
        >
          <template x-if="cargando">
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </template>
          <span x-text="cargando ? 'Verificando...' : 'Ingresar al Catálogo 🚀'"></span>
        </button>
      </form>
    </div>
  </div>

  <div x-show="sesionIniciada" class="min-h-screen flex flex-col" x-cloak>
    
    <header class="bg-white border-b border-gray-200 shadow-xs sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row gap-4 items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-3xl">📚</span>
          <div>
            <h1 class="text-lg font-black tracking-tight text-gray-900">Biblioteca Digital</h1>
            <p class="text-xs text-gray-400 font-medium">Gestión del conocimiento de Hidrocarburos</p>
          </div>
        </div>

        <div class="flex flex-wrap items-center justify-center sm:justify-end gap-3 w-full sm:w-auto">
          <div class="text-right hidden md:block">
            <div class="text-xs font-bold text-gray-800" x-text="usuario.email"></div>
            <div class="text-[10px] font-black tracking-wider uppercase text-blue-600" x-text="'Rol: ' + usuario.rol"></div>
          </div>
          
          <template x-if="usuario.permissions.crear">
            <button @click="modalAñadir = true" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-md transition flex items-center gap-1.5">
              <span>+ Añadir Archivo</span>
            </button>
          </template>

          <button @click="cerrarSesion()" class="px-3 py-2 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold rounded-xl transition">
            Salir
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
      
      <div class="bg-white rounded-2xl p-4 shadow-xs border border-gray-100 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
        <div class="w-full md:w-1/3 relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">🔍</span>
          <input 
            type="text" 
            x-model="busqueda" 
            placeholder="Buscar por ID, título, descripción o tags..." 
            class="w-full pl-9 pr-4 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700 transition"
          />
        </div>

        <div class="w-full md:w-auto flex flex-col sm:flex-row gap-3 items-center md:justify-end">
          <div class="w-full sm:w-44">
            <select x-model="filtroArea" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm text-gray-600 focus:ring-2 focus:ring-blue-500 outline-none transition">
              <option value="">Todas las Áreas</option>
              <template x-for="area in areas" :key="area">
                <option :value="area" x-text="area"></option>
              </template>
            </select>
          </div>

          <div class="w-full sm:w-44">
            <select x-model="filtroCategoria" class="w-full p-2 border border-gray-200 rounded-xl bg-white text-sm text-gray-600 focus:ring-2 focus:ring-blue-500 outline-none transition">
              <option value="">Todas las Categorías</option>
              <template x-for="cat in categorias" :key="cat">
                <option :value="cat" x-text="cat"></option>
              </template>
            </select>
          </div>

          <template x-if="busqueda || filtroArea || filtroCategoria">
            <button @click="busqueda = ''; filtroArea = ''; filtroCategoria = ''" class="w-full sm:w-auto px-4 py-2 text-xs font-bold bg-gray-100 hover:bg-gray-200 text-gray-500 rounded-xl transition">
              Limpiar
            </button>
          </template>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-xs border border-gray-100 overflow-hidden relative min-h-[250px]">
        
        <div x-show="cargando" class="absolute inset-0 bg-white/70 backdrop-blur-[1px] flex flex-col items-center justify-center z-10 transition-all">
          <div class="animate-spin rounded-full h-10 w-10 border-4 border-gray-200 border-t-blue-600 mb-3"></div>
          <p class="text-xs font-semibold text-gray-500 tracking-wide animate-pulse">Sincronizando biblioteca técnica...</p>
        </div>

        <div class="overflow-x-auto" :class="{ 'opacity-30 pointer-events-none': cargando }">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gray-50 border-b border-gray-100 text-xs font-bold text-gray-500 uppercase tracking-wider">
                <th class="p-4">ID</th>
                <th class="p-4">Título</th>
                <th class="p-4 hidden md:table-cell">Categoría</th>
                <th class="p-4 hidden sm:table-cell">Área</th>
                <th class="p-4 hidden lg:table-cell">Fecha</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 text-sm">
              <template x-for="item in archivosFiltrados" :key="item.id">
                <tr @click="abrirDetalles(item)" class="hover:bg-blue-50/50 cursor-pointer transition">
                  <td class="p-4 font-mono font-bold text-blue-600" x-text="item.id"></td>
                  <td class="p-4">
                    <div class="font-semibold text-gray-800" x-text="item.titulo"></div>
                    <div class="md:hidden text-xs text-gray-400 mt-0.5 flex gap-2">
                      <span x-text="item.categoria"></span> • <span x-text="item.area"></span>
                    </div>
                  </td>
                  <td class="p-4 hidden md:table-cell text-gray-600" x-text="item.categoria"></td>
                  <td class="p-4 hidden sm:table-cell text-gray-600">
                    <span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-green-50 text-green-700" x-text="item.area"></span>
                  </td>
                  <td class="p-4 hidden lg:table-cell text-gray-400" x-text="new Date(item.fecha).toLocaleDateString()"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <template x-if="!cargando && archivosFiltrados.length === 0">
          <div class="text-center py-12 text-gray-400 text-sm">No se encontraron registros que coincidan con los filtros.</div>
        </template>
      </div>
    </main>

    <div x-show="modalDetalles" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" x-cloak>
      <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-gray-100 max-h-[90vh] overflow-y-auto" @click.away="if(!editando) modalDetalles = false">
        
        <div class="flex justify-between items-start mb-4">
          <div>
            <span class="font-mono text-xs font-black bg-blue-50 text-blue-600 px-2.5 py-1 rounded-md" x-text="itemDetalle.id"></span>
            <template x-if="!editando">
              <h3 class="text-xl font-bold text-gray-900 mt-2" x-text="itemDetalle.titulo"></h3>
            </template>
            <template x-if="editando">
              <div class="mt-2 w-full">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Título del Documento *</label>
                <input type="text" x-model="formEdicion.titulo" class="w-full p-2 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              </div>
            </template>
          </div>
          <button @click="modalDetalles = false; cancelarEdicion()" class="text-gray-400 hover:text-gray-600 text-xl font-bold p-1">&times;</button>
        </div>

        <div class="space-y-4 my-4 border-t border-b border-gray-100 py-4 text-sm text-gray-700">
          <div>
            <span class="font-bold text-gray-500 block text-xs uppercase mb-1">Descripción:</span>
            <template x-if="!editando">
              <p class="text-gray-800 bg-gray-50/50 p-2 rounded-xl" x-text="itemDetalle.descripcion || 'Sin descripción disponible.'"></p>
            </template>
            <template x-if="editando">
              <textarea x-model="formEdicion.descripcion" rows="3" class="w-full p-2 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </template>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <span class="font-bold text-gray-500 block text-xs uppercase mb-1">Categoría:</span>
              <template x-if="!editando">
                <span class="text-gray-800 font-medium bg-gray-50 p-2 rounded-xl block" x-text="itemDetalle.categoria"></span>
              </template>
              <template x-if="editando">
                <select x-model="formEdicion.categoria" class="w-full p-2 border border-gray-300 rounded-xl bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                  <template x-for="cat in categorias" :key="cat">
                    <option :value="cat" x-text="cat" :selected="cat === formEdicion.categoria"></option>
                  </template>
                </select>
              </template>
            </div>
            <div>
              <span class="font-bold text-gray-500 block text-xs uppercase mb-1">Área Técnica:</span>
              <template x-if="!editando">
                <span class="text-gray-800 font-medium bg-gray-50 p-2 rounded-xl block" x-text="itemDetalle.area"></span>
              </template>
              <template x-if="editando">
                <select x-model="formEdicion.area" class="w-full p-2 border border-gray-300 rounded-xl bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                  <template x-for="area in areas" :key="area">
                    <option :value="area" x-text="area" :selected="area === formEdicion.area"></option>
                  </template>
                </select>
              </template>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <span class="font-bold text-gray-500 block text-xs uppercase mb-1">Registrado por:</span>
              <span class="text-gray-600 bg-gray-50 p-2 rounded-xl block" x-text="itemDetalle.usuario"></span>
            </div>
            <div>
              <span class="font-bold text-gray-500 block text-xs uppercase mb-1">Tags:</span>
              <template x-if="!editando">
                <span class="text-gray-600 bg-gray-50 p-2 rounded-xl block" x-text="itemDetalle.tags || 'Ninguno'"></span>
              </template>
              <template x-if="editando">
                <input type="text" x-model="formEdicion.tags" placeholder="Separados por coma" class="w-full p-2 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              </template>
            </div>
          </div>
        </div>

        <div class="flex flex-wrap justify-end gap-2 mt-6">
          <template x-if="!editando">
            <div class="flex gap-2 w-full sm:w-auto justify-end">
              <button @click="modalDetalles = false" class="px-4 py-2 text-sm font-semibold bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition">Cerrar</button>
              <a :href="itemDetalle.url" target="_blank" class="px-4 py-2 text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-sm transition flex items-center gap-1">
                <span>Abrir Archivo 🚀</span>
              </a>
              <template x-if="usuario.permissions.editar">
                <button @click="activarEdicion()" class="px-4 py-2 text-sm font-bold bg-amber-500 hover:bg-amber-600 text-white rounded-xl shadow-sm transition">Editar</button>
              </template>
              <template x-if="usuario.permissions.borrar">
                <button @click="ejecutarEliminacion()" class="px-4 py-2 text-sm font-bold bg-red-600 hover:bg-red-700 text-white rounded-xl shadow-sm transition">Eliminar</button>
              </template>
            </div>
          </template>

          <template x-if="editando">
            <div class="flex gap-2 w-full sm:w-auto justify-end">
              <button type="button" @click="cancelarEdicion()" :disabled="guardandoCambios" class="px-4 py-2 text-sm font-semibold bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition">Cancelar</button>
              <button type="button" @click="guardarCambiosEdicion()" :disabled="guardandoCambios" class="px-4 py-2 text-sm font-bold bg-green-600 hover:bg-green-700 text-white rounded-xl shadow-sm transition flex items-center gap-2">
                <template x-if="guardandoCambios">
                  <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </template>
                <span x-text="guardandoCambios ? 'Guardando...' : 'Confirmar Cambios 💾'"></span>
              </button>
            </div>
          </template>
        </div>
      </div>
    </div>

    <div x-show="modalAñadir" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" x-cloak>
      <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-gray-100" @click.away="!subiendo && (modalAñadir = false)">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-bold text-gray-900">Subir Documento Técnico</h3>
          <button @click="if(!subiendo) modalAñadir = false" class="text-gray-400 hover:text-gray-600 text-xl font-bold p-1">&times;</button>
        </div>

        <form @submit.prevent="subirNuevoArchivo()" class="space-y-4 text-sm text-gray-700">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Archivo Adjunto *</label>
            <input type="file" @change="cargarArchivoLocal($event)" required :disabled="subiendo" class="w-full text-xs p-2.5 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Título del Documento *</label>
            <input type="text" x-model="nuevoForm.titulo" required :disabled="subiendo" placeholder="Ej: Manual de Compresores Centrifugos" class="w-full p-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Descripción</label>
            <textarea x-model="nuevoForm.descripcion" :disabled="subiendo" rows="2" placeholder="Detalles técnicos esenciales..." class="w-full p-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Categoría *</label>
              <select x-model="nuevoForm.categoria" required :disabled="subiendo" class="w-full p-2 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="">Seleccione...</option>
                <template x-for="cat in categorias" :key="cat">
                  <option :value="cat" x-text="cat"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Área Técnica *</label>
              <select x-model="nuevoForm.area" required :disabled="subiendo" class="w-full p-2 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="">Seleccione...</option>
                <template x-for="area in areas" :key="area">
                  <option :value="area" x-text="area"></option>
                </template>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Tags (Palabras clave)</label>
            <input type="text" x-model="nuevoForm.tags" :disabled="subiendo" placeholder="Ej: upstream, bombas, mtto" class="w-full p-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" />
          </div>

          <div class="flex justify-end gap-2 pt-4 border-t border-gray-100">
            <button type="button" @click="modalAñadir = false" :disabled="subiendo" class="px-4 py-2 text-sm font-semibold bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition">Cancelar</button>
            <button type="submit" :disabled="subiendo" class="px-5 py-2 text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md transition flex items-center gap-1.5">
              <template x-if="subiendo">
                <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
              </template>
              <span x-text="subiendo ? 'Subiendo archivo...' : 'Guardar en Catálogo 🚀'"></span>
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzL7K6gW_4T_7gS1TqYhR3hF7CylX4pXgN6X6T3vHmxXfN4_f1oUXW_U8nF_uXn8w/exec"; 

    function bibliotecaApp() {
      return {
        sesionIniciada: false,
        cargando: false,
        subiendo: false,
        busqueda: '',
        filtroArea: '',
        filtroCategoria: '',
        
        emailInput: '',
        password: '',
        mostrarPassword: false,

        usuario: { email: '', rol: '', permissions: { crear: false, leer: false, editar: false, borrar: false } },
        archivos: [],
        categorias: ['Planos', 'Manuales', 'Procedimientos', 'Informes', 'Especificaciones'],
        areas: ['Upstream', 'Midstream', 'Downstream', 'Seguridad', 'Mantenimiento'],

        modalAñadir: false,
        modalDetalles: false,
        itemDetalle: {},
        editando: false,
        guardandoCambios: false,
        
        nuevoForm: { titulo: '', descripcion: '', area: '', categoria: '', tags: '', file: null },
        formEdicion: { id: '', titulo: '', descripcion: '', area: '', categoria: '', tags: '' },

        async init() {
          const emailGuardado = localStorage.getItem('userEmail');
          if (emailGuardado) {
            this.emailInput = emailGuardado;
          }
        },

        async loginUsuario() {
          if (!this.emailInput || !this.password) {
            alert('Por favor, rellene todos los campos.');
            return;
          }
          this.cargando = true;
          try {
            const respuesta = await ejecutarPeticionJSONP('validarUsuario', {
              email: this.emailInput.trim(),
              password: this.password.trim()
            });

            if (respuesta.status === 'success') {
              this.usuario = respuesta.usuario;
              this.sesionIniciada = true;
              localStorage.setItem('userEmail', this.usuario.email);
              await this.inicializarDatos();
            } else {
              alert(respuesta.message);
            }
          } catch (e) {
            alert('Error crítico de conexión al validar credenciales.');
            console.error(e);
          } finally {
            this.cargando = false;
          }
        },

        cerrarSesion() {
          this.sesionIniciada = false;
          this.password = '';
          this.usuario = { email: '', rol: '', permissions: { crear: false, leer: false, editar: false, borrar: false } };
          this.archivos = [];
        },

        async inicializarDatos() {
          this.cargando = true;
          try {
            const respuesta = await ejecutarPeticionJSONP('obtenerArchivos', { email: this.usuario.email });
            if (respuesta.status === 'success') {
              this.archivos = respuesta.data;
            } else {
              alert('No se pudo cargar la biblioteca: ' + respuesta.message);
            }
          } catch (e) {
            console.error('Error cargando el catálogo:', e);
          } finally {
            this.cargando = false;
          }
        },

        get archivosFiltrados() {
          return this.archivos.filter(item => {
            const matchesArea = !this.filtroArea || item.area === this.filtroArea;
            const matchesCat = !this.filtroCategoria || item.categoria === this.filtroCategoria;
            
            const txt = String(this.busqueda).toLowerCase().trim();
            const matchesTxt = !txt || 
              String(item.id).toLowerCase().includes(txt) ||
              String(item.titulo).toLowerCase().includes(txt) ||
              String(item.descripcion).toLowerCase().includes(txt) ||
              String(item.tags).toLowerCase().includes(txt);

            return matchesArea && matchesCat && matchesTxt;
          });
        },

        abrirDetalles(item) {
          this.itemDetalle = item;
          this.modalDetalles = true;
          this.editando = false;
        },

        activarEdicion() {
          this.formEdicion = {
            id: this.itemDetalle.id,
            titulo: this.itemDetalle.titulo,
            descripcion: this.itemDetalle.descripcion,
            area: this.itemDetalle.area,
            categoria: this.itemDetalle.categoria,
            tags: this.itemDetalle.tags
          };
          this.editando = true;
        },

        cancelarEdicion() {
          this.editando = false;
          this.formEdicion = { id: '', titulo: '', descripcion: '', area: '', categoria: '', tags: '' };
        },

        async guardarCambiosEdicion() {
          if (!this.formEdicion.titulo) return alert('El título es obligatorio.');
          this.guardandoCambios = true;

          try {
            const respuesta = await ejecutarPeticionJSONP('editarArchivo', {
              email: this.usuario.email,
              id: this.formEdicion.id,
              titulo: this.formEdicion.titulo,
              descripcion: this.formEdicion.descripcion,
              area: this.formEdicion.area,
              categoria: this.formEdicion.categoria,
              tags: this.formEdicion.tags
            });

            if (respuesta.status === 'success') {
              alert(respuesta.message);
              this.modalDetalles = false;
              this.cancelarEdicion();
              await this.inicializarDatos();
            } else {
              alert(respuesta.message);
            }
          } catch (e) {
            alert('Error al intentar guardar los cambios.');
            console.error(e);
          } finally {
            this.guardandoCambios = false;
          }
        },

        async ejecutarEliminacion() {
          const confirmar = confirm(`¿Estás completamente seguro de que deseas eliminar permanentemente el registro ${this.itemDetalle.id} y su archivo adjunto?`);
          if (!confirmar) return;

          try {
            const respuesta = await ejecutarPeticionJSONP('eliminarArchivo', {
              email: this.usuario.email,
              id: this.itemDetalle.id
            });

            if (respuesta.status === 'success') {
              alert(respuesta.message);
              this.modalDetalles = false;
              await this.inicializarDatos();
            } else {
              alert(respuesta.message);
            }
          } catch (e) {
            alert('Error en el sistema al intentar eliminar.');
            console.error(e);
          }
        },

        cargarArchivoLocal(event) {
          const file = event.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (e) => {
            this.nuevoForm.file = {
              base64: e.target.result,
              filename: file.name,
              mimeType: file.type
            };
            if (!this.nuevoForm.titulo) {
              this.nuevoForm.titulo = file.name.split('.').slice(0, -1).join('.');
            }
          };
          reader.readAsDataURL(file);
        },

        async subirNuevoArchivo() {
          if (!this.nuevoForm.file) return alert('Por favor, seleccione un archivo válido.');
          this.subiendo = true;

          const payload = {
            action: 'subirArchivo',
            email: this.usuario.email,
            titulo: this.nuevoForm.titulo,
            descripcion: this.nuevoForm.descripcion,
            area: this.nuevoForm.area,
            categoria: this.nuevoForm.categoria,
            tags: this.nuevoForm.tags,
            file: this.nuevoForm.file
          };

          try {
            await fetch(WEB_APP_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            
            alert('Documento enviado con éxito. Sincronizando biblioteca...');
            this.modalAñadir = false;
            this.nuevoForm = { titulo: '', descripcion: '', area: '', categoria: '', tags: '', file: null };
            
            const self = this;
            setTimeout(async () => { await self.inicializarDatos(); }, 2500);
          } catch (e) {
            alert('Error al intentar registrar el archivo: ' + e.toString());
          } finally {
            this.subiendo = false;
          }
        }
      }
    }

    function ejecutarPeticionJSONP(action, params = {}) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Math.round(Math.random() * 1000000);
        
        window[callbackName] = function(data) {
          delete window[callbackName];
          document.body.removeChild(script);
          resolve(data);
        };

        const queryParams = new URLSearchParams({ action, ...params, callback: callbackName });
        const script = document.createElement('script');
        script.src = WEB_APP_URL + '?' + queryParams.toString();
        script.onerror = () => {
          delete window[callbackName];
          document.body.removeChild(script);
          reject(new Error('Fallo en la llamada de red por JSONP'));
        };
        document.body.appendChild(script);
      });
    }
  </script>
