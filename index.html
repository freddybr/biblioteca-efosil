<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Biblioteca</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans" x-data="bibliotecaApp()" x-init="init()">

  <header class="bg-blue-600 text-white px-6 py-4 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold flex items-center gap-2">
        📚 Mi Biblioteca
      </h1>
      <p class="text-xs text-blue-200" x-text="'Rol: ' + usuario.rol"></p>
    </div>
    <div class="flex items-center gap-4">
      <span class="text-sm hidden sm:inline" x-text="usuario.email"></span>
      <button @click="salir()" class="text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded transition">Salir</button>
      <template x-if="usuario.permissions.crear">
        <button @click="abrirModalAñadir()" class="bg-green-500 hover:bg-green-600 text-white font-semibold px-4 py-1.5 rounded shadow shadow-green-700 transition flex items-center gap-1">
          <span>+ Añadir</span>
        </button>
      </template>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6">
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 space-y-4">
      
      <div>
        <input 
          type="text" 
          placeholder="Buscar por ID, título, descripción o tags..." 
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-sm"
          x-model="busqueda"
        >
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Filtrar por Área:</label>
          <select 
            x-model="filtroArea" 
            class="w-full bg-gray-50 border border-gray-300 text-gray-700 py-2 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition"
          >
            <option value="">Todas las Áreas</option>
            <template x-for="area in areas" :key="area">
              <option :value="area" x-text="area"></option>
            </template>
          </select>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Filtrar por Tipo (Categoría):</label>
          <select 
            x-model="filtroCategoria" 
            class="w-full bg-gray-50 border border-gray-300 text-gray-700 py-2 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition"
          >
            <option value="">Todas las Categorías</option>
            <template x-for="cat in categorias" :key="cat">
              <option :value="cat" x-text="cat"></option>
            </template>
          </select>
        </div>
      </div>
    </div>

    <div x-show="cargando" class="flex flex-col items-center justify-center py-12 gap-2 text-gray-500">
      <svg class="animate-spin h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span class="text-sm">Cargando biblioteca digital...</span>
    </div>

    <div x-show="!cargando" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
      <template x-for="archivo in archivosFiltrados" :key="archivo.id">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col justify-between hover:shadow-md transition">
          <div>
            <div class="flex justify-between items-start gap-2 mb-3">
              <span class="bg-blue-50 text-blue-600 font-bold px-2 py-0.5 rounded text-xs" x-text="archivo.id"></span>
              <div class="flex flex-wrap gap-1">
                <span class="bg-emerald-50 text-emerald-700 font-medium px-2 py-0.5 rounded-full text-2xs border border-emerald-200 text-[11px]" x-text="archivo.area"></span>
                <span class="bg-gray-100 text-gray-600 font-medium px-2 py-0.5 rounded-full text-2xs text-[11px]" x-text="archivo.categoria"></span>
              </div>
            </div>

            <h3 class="text-lg font-bold text-gray-900 mb-1" x-text="archivo.titulo"></h3>
            <p class="text-sm text-gray-500 line-clamp-2 mb-4" x-text="archivo.descripcion || 'Sin descripción.'"></p>
            
            <template x-if="archivo.tags">
              <div class="flex flex-wrap gap-1 mb-4">
                <span class="bg-purple-50 text-purple-600 text-xs px-2 py-0.5 rounded border border-purple-100" x-text="'#' + archivo.tags"></span>
              </div>
            </template>
          </div>

          <div class="border-t border-gray-100 pt-3 mt-2 flex justify-between items-center text-xs text-gray-400">
            <span x-text="'Por: ' + archivo.usuario.split('@')[0]"></span>
            <a :href="archivo.url" target="_blank" class="inline-flex items-center gap-1 font-semibold text-blue-600 hover:text-blue-800 hover:underline transition text-sm">
              Abrir archivo 🚀
            </a>
          </div>
        </div>
      </template>
    </div>

    <div x-show="!cargando && archivosFiltrados.length === 0" class="text-center py-12 text-gray-400 bg-white rounded-xl border border-dashed border-gray-300">
      No se encontraron archivos que coincidan con los filtros seleccionados.
    </div>
  </main>

  <script>
    function bibliotecaApp() {
      return {
        // Estado
        usuario: { email: 'freddybr.edu@gmail.com', rol: 'Admin', permissions: { crear: true, leer: true } }, // Simulado basado en imágenes
        archivos: [],
        areas: [],
        categorias: [],
        busqueda: '',
        filtroArea: '',
        filtroCategoria: '',
        cargando: false,

        init() {
          this.cargarFiltrosYDatos();
        },

        cargarFiltrosYDatos() {
          this.cargando = true;
          
          // 1. Cargar filtros dinámicos desde las pestañas "Areas" y "Categorias" de Sheets
          google.script.run
            .withSuccessHandler((response) => {
              if (response.status === 'success') {
                this.areas = response.areas;
                this.categorias = response.categorias;
              }
            })
            .procesarAccion({ action: 'obtenerFiltrosDinamicos', email: this.usuario.email });

          // 2. Cargar base de datos de archivos de la pestaña "Archivos"
          google.script.run
            .withSuccessHandler((response) => {
              if (response.status === 'success') {
                this.archivos = response.data;
              } else {
                alert('Error al sincronizar datos: ' + response.message);
              }
              this.cargando = false;
            })
            .withFailureHandler(() => { this.cargando = false; })
            .procesarAccion({ action: 'obtenerArchivos', email: this.usuario.email });
        },

        // Lógica del filtro en tiempo real combinando inputs y selectores
        get archivosFiltrados() {
          return this.archivos.filter(archivo => {
            const matchesBusqueda = !this.busqueda || 
              archivo.id.toLowerCase().includes(this.busqueda.toLowerCase()) ||
              archivo.titulo.toLowerCase().includes(this.busqueda.toLowerCase()) ||
              (archivo.descripcion && archivo.descripcion.toLowerCase().includes(this.busqueda.toLowerCase())) ||
              (archivo.tags && archivo.tags.toLowerCase().includes(this.busqueda.toLowerCase()));

            const matchesArea = !this.filtroArea || archivo.area === this.filtroArea;
            const matchesCategoria = !this.filtroCategoria || archivo.categoria === this.filtroCategoria;

            return matchesBusqueda && matchesArea && matchesCategoria;
          });
        },

        abrirModalAñadir() {
          alert('Función nativa para abrir formulario de carga (.subirArchivo)');
        },

        salir() {
          alert('Sesión cerrada');
        }
      }
    }
  </script>
</body>
</html>
